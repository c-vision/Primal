  <text x="50.0" y="296.0" text-anchor="start" font-family="sans-serif" font-size="15" fill="#17212b" stroke="#fff" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round">Farkas vector of the reduced row: y3 = -1, since b'y = (-2)(-1) = 2 &gt; 0 and A'y = -1 &lt;= 0.</text>
  <text x="50.0" y="330.0" text-anchor="start" font-family="sans-serif" font-size="15" fill="#b45309" stroke="#fff" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round">Reverse replay, homogeneous: y2 = -(A_{3y} y3) / A_{2y} = 1,   y1 = -(A_{2x} y2) / A_{1x} = -1.</text>
  <text x="50.0" y="356.0" text-anchor="start" font-family="sans-serif" font-size="15" fill="#b45309" stroke="#fff" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round">Lifted: y = (-1, 1, -1);  b'y = -2 + 5 - 1 = 2 (unchanged);  A'y = (0, 0, -1) &lt;= 0.</text>
  <text x="50.0" y="396.0" text-anchor="start" font-family="sans-serif" font-size="13" fill="#6b7280" stroke="#fff" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round">Shaded cell: nonzero of an active row and column. Grey: removed. The right-hand side column shows the substitution b_k - A_kj x_j.</text>
