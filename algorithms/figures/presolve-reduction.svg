<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" role="img" aria-labelledby="title desc">
  <title id="title">Presolve removes singleton rows and lifts a Farkas vector back</title>
  <desc id="desc">Three panels showing the 3 by 3 constraint matrix of x=2, x+y=5, y+z=1 with x,y,z nonnegative. Singleton row 1 fixes x=2 and is removed with column x; singleton row 2 then fixes y=3 and is removed with column y; the surviving row 3 reads z=-2, which is infeasible with a Farkas multiplier of -1. Replaying the removals in reverse with the homogeneous lift gives the multipliers (-1, 1, -1) on the original rows, with b'y=2 and A'y&lt;=0. Computed with lp_presolve and presolve_postsolve_dir at revision 1f2ddee.</desc>
