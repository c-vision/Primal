<svg xmlns="http://www.w3.org/2000/svg" width="760" height="480" viewBox="0 0 760 480" role="img" aria-labelledby="title desc">
  <title id="title">Sections of the exponential cone</title>
  <desc id="desc">Two sections of the exponential cone t &gt;= u exp(v/u) in the (v, t) plane: the curve t = exp(v) for u = 1 with the region above it shaded, and the curve t = 2 exp(v/2) for u = 2. The point (v, t) = (0, 2) of the section u = 2 is the optimum (t,u,v) = (2,2,0) of minimize t subject to u + v = 2. Analytic figure; membership tested with expcone_barrier and the optimum checked against PRIMAL at revision 1f2ddee.</desc>
