<svg xmlns="http://www.w3.org/2000/svg" width="800" height="460" viewBox="0 0 800 460" role="img" aria-labelledby="title desc">
  <title id="title">Equilibration of a badly scaled matrix</title>
  <desc id="desc">Binary exponents of the entries of a 6x6 matrix before and after scale_equilibrate. Before, the exponents run from -21 to 18 (ratio of largest to smallest entry 4.1e+11); after four passes of power-of-two row and column scaling they lie between -1 and -1 (ratio 2.0). Every scaled entry equals r_i d_j a_ij exactly. Computed with scale_equilibrate at revision 1f2ddee.</desc>
