  <line x1="198.2" y1="390.0" x2="198.2" y2="395.0" stroke="#17212b" stroke-width="1.0"/>
  <text x="198.2" y="410.0" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#17212b" stroke="#fff" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round">1</text>
  <line x1="283.6" y1="390.0" x2="283.6" y2="395.0" stroke="#17212b" stroke-width="1.0"/>
  <text x="283.6" y="410.0" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#17212b" stroke="#fff" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round">2</text>
  <line x1="369.1" y1="390.0" x2="369.1" y2="395.0" stroke="#17212b" stroke-width="1.0"/>
