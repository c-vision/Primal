  <line x1="283.6" y1="240.0" x2="424.6" y2="174.0" stroke="#b45309" stroke-width="3.5" marker-end="url(#arrb)"/>
  <rect x="277.6" y="234.0" width="12" height="12" fill="#17212b"/>
  <text x="296.5" y="147.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#155097" stroke="#fff" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round">n1 = (1, 1)</text>
  <text x="368.5" y="262.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#155097" stroke="#fff" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round">n2 = (1, 0)</text>
  <text x="434.6" y="178.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#b45309" stroke="#fff" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round">g = (3, 2)</text>
  <text x="121.3" y="147.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#155097" stroke="#fff" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round">x + y = 4</text>
  <text x="290.5" y="75.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#155097" stroke="#fff" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round">x = 2</text>
  <text x="121.3" y="69.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#b45309" stroke="#fff" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round">3x + 2y = 10</text>
  <text x="121.3" y="339.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#17212b" stroke="#fff" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round">feasible polygon</text>
  <text x="273.6" y="264.0" text-anchor="end" font-family="sans-serif" font-size="14" fill="#17212b" stroke="#fff" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round">(2, 2)</text>
  <text x="70.0" y="452.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#17212b" stroke="#fff" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round">g = 2 n1 + 1 n2: the gradient lies in the cone of the active normals (shaded),</text>
  <text x="70.0" y="472.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#17212b" stroke="#fff" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round">so every line through (2, 2) with a normal in that cone supports the polygon.</text>
