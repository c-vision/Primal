<svg xmlns="http://www.w3.org/2000/svg" width="700" height="500" viewBox="0 0 700 500" role="img" aria-labelledby="title desc">
  <title id="title">A supporting hyperplane at the optimal vertex</title>
  <desc id="desc">The polygon with vertices (0,0), (2,0), (2,2) and (0,4). At the optimal vertex (2,2) the two active constraints have normals (1,1) and (1,0); the objective gradient (3,2) equals 2 times the first plus 1 times the second, so it lies in the cone they span, shaded. Every line through (2,2) whose normal lies in that cone supports the polygon; the line 3x+2y=10 is one of them. Analytic figure, multipliers checked against PRIMAL at revision 1f2ddee.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17212b"/></marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b45309"/></marker>
  </defs>
  <rect width="700" height="500" fill="#fff"/>
  <text x="350.0" y="30.0" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#17212b" stroke="#fff" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round">Supporting lines at the optimal vertex</text>
  <clipPath id="win"><rect x="70.0" y="60.0" width="470.0" height="330.0"/></clipPath>
  <g clip-path="url(#win)">
