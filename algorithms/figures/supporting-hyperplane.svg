  <text x="64.0" y="42.0" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#17212b" stroke="#fff" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round">y</text>
  <line x1="283.6" y1="240.0" x2="360.5" y2="186.0" stroke="#155097" stroke-width="3.0" marker-end="url(#arr)"/>
