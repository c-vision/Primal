  <line x1="65.0" y1="332.0" x2="70.0" y2="332.0" stroke="#17212b" stroke-width="1.0"/>
  <text x="61.0" y="337.0" text-anchor="end" font-family="sans-serif" font-size="14" fill="#17212b" stroke="#fff" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round">0</text>
  <line x1="65.0" y1="264.0" x2="70.0" y2="264.0" stroke="#17212b" stroke-width="1.0"/>
  <text x="61.0" y="269.0" text-anchor="end" font-family="sans-serif" font-size="14" fill="#17212b" stroke="#fff" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round">1</text>
  <line x1="65.0" y1="196.0" x2="70.0" y2="196.0" stroke="#17212b" stroke-width="1.0"/>
  <text x="61.0" y="201.0" text-anchor="end" font-family="sans-serif" font-size="14" fill="#17212b" stroke="#fff" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round">2</text>
  <line x1="65.0" y1="128.0" x2="70.0" y2="128.0" stroke="#17212b" stroke-width="1.0"/>
  <text x="61.0" y="133.0" text-anchor="end" font-family="sans-serif" font-size="14" fill="#17212b" stroke="#fff" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round">3</text>
  <line x1="65.0" y1="60.0" x2="70.0" y2="60.0" stroke="#17212b" stroke-width="1.0"/>
  <text x="61.0" y="65.0" text-anchor="end" font-family="sans-serif" font-size="14" fill="#17212b" stroke="#fff" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round">4</text>
  <text x="518.0" y="422.0" text-anchor="start" font-family="sans-serif" font-size="16" fill="#17212b" stroke="#fff" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round">x1</text>
  <text x="64.0" y="42.0" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#17212b" stroke="#fff" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round">x2</text>
  <line x1="70.0" y1="128.0" x2="422.0" y2="400.0" stroke="#155097" stroke-width="3.5"/>
  <line x1="422.0" y1="400.0" x2="422.0" y2="60.0" stroke="#155097" stroke-width="2.0" stroke-dasharray="10 6"/>
  <text x="74.4" y="111.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#155097" stroke="#fff" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round">x1 + x2 = 2  (active)</text>
  <text x="429.0" y="70.2" text-anchor="start" font-family="sans-serif" font-size="14" fill="#155097" stroke="#fff" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round">x1 = 3  (inactive)</text>
  <line x1="246.0" y1="264.0" x2="188.8" y2="308.2" stroke="#17212b" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="246.0" y1="264.0" x2="316.4" y2="209.6" stroke="#b45309" stroke-width="2.5" marker-end="url(#arrb)"/>
  <text x="324.4" y="213.6" text-anchor="start" font-family="sans-serif" font-size="14" fill="#b45309" stroke="#fff" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round">row normal (1, 1)</text>
  <text x="78.8" y="283.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#17212b" stroke="#fff" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round">-gradient (-1, -1)</text>
  <rect x="240.0" y="258.0" width="12" height="12" fill="#17212b"/>
  <text x="234.0" y="250.0" text-anchor="end" font-family="sans-serif" font-size="14" fill="#17212b" stroke="#fff" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round">optimum (1, 1), f = 1</text>
  <circle cx="158.0" cy="332.0" r="5" fill="#fff" stroke="#17212b" stroke-width="2"/>
  <text x="78.8" y="374.2" text-anchor="start" font-family="sans-serif" font-size="14" fill="#17212b" stroke="#fff" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round">O: unconstrained minimum (0, 0), infeasible</text>
  <text x="70.0" y="452.0" text-anchor="start" font-family="sans-serif" font-size="13" fill="#6b7280" stroke="#fff" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round">Circles: level sets of f = (x1^2 + x2^2) / 2 at 0.5, 1 (solid), 2 and 4.</text>
  <text x="70.0" y="472.0" text-anchor="start" font-family="sans-serif" font-size="13" fill="#6b7280" stroke="#fff" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round">At the optimum the gradient (1, 1) equals the multiplier 1 times the row normal (1, 1).</text>
</svg>
