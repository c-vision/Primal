<svg xmlns="http://www.w3.org/2000/svg" width="700" height="500" viewBox="0 0 700 500" role="img" aria-labelledby="title desc">
  <title id="title">Contours of a convex QP and its active constraint</title>
  <desc id="desc">Circular contours of (x1^2+x2^2)/2 centred at the origin, the feasible region above the line x1+x2=2 and to the left of x1=3, and the constrained minimum (1,1) with objective 1, where the gradient (1,1) equals the multiplier 1 times the row normal (1,1). Analytic figure, optimum checked against PRIMAL at revision 1f2ddee.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17212b"/></marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b45309"/></marker>
  </defs>
  <rect width="700" height="500" fill="#fff"/>
  <clipPath id="win"><rect x="70.0" y="60.0" width="440.0" height="340.0"/></clipPath>
  <text x="350.0" y="30.0" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#17212b" stroke="#fff" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round">A convex QP: contours and the active constraint</text>
  <g clip-path="url(#win)">
  <path d="M70.0 128.0L422.0 400.0L422.0 60.0L70.0 60.0Z" fill="#dbeafe"/>
  <circle cx="158.0" cy="332.0" r="88.0" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="7 5"/>
  <circle cx="158.0" cy="332.0" r="124.5" fill="none" stroke="#b45309" stroke-width="2.5"/>
  <circle cx="158.0" cy="332.0" r="176.0" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="7 5"/>
  <circle cx="158.0" cy="332.0" r="248.9" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="7 5"/>
  </g>
  <line x1="70.0" y1="400.0" x2="524.0" y2="400.0" stroke="#17212b" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="70.0" y1="400.0" x2="70.0" y2="46.0" stroke="#17212b" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="70.0" y1="400.0" x2="70.0" y2="405.0" stroke="#17212b" stroke-width="1.0"/>
  <text x="70.0" y="420.0" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#17212b" stroke="#fff" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round">-1</text>
  <line x1="158.0" y1="400.0" x2="158.0" y2="405.0" stroke="#17212b" stroke-width="1.0"/>
  <text x="158.0" y="420.0" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#17212b" stroke="#fff" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round">0</text>
  <line x1="246.0" y1="400.0" x2="246.0" y2="405.0" stroke="#17212b" stroke-width="1.0"/>
  <text x="246.0" y="420.0" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#17212b" stroke="#fff" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round">1</text>
  <line x1="334.0" y1="400.0" x2="334.0" y2="405.0" stroke="#17212b" stroke-width="1.0"/>
  <text x="334.0" y="420.0" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#17212b" stroke="#fff" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round">2</text>
  <line x1="422.0" y1="400.0" x2="422.0" y2="405.0" stroke="#17212b" stroke-width="1.0"/>
  <text x="422.0" y="420.0" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#17212b" stroke="#fff" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round">3</text>
  <line x1="510.0" y1="400.0" x2="510.0" y2="405.0" stroke="#17212b" stroke-width="1.0"/>
  <text x="510.0" y="420.0" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#17212b" stroke="#fff" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round">4</text>
  <line x1="65.0" y1="400.0" x2="70.0" y2="400.0" stroke="#17212b" stroke-width="1.0"/>
