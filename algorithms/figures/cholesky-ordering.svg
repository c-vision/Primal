<svg xmlns="http://www.w3.org/2000/svg" width="720" height="600" viewBox="0 0 720 600" role="img" aria-labelledby="title desc">
  <title id="title">Cholesky fill with the natural order and with AMD</title>
  <desc id="desc">Sparsity patterns of a 10 by 10 arrowhead matrix and of its Cholesky factor. In the natural order, with the hub first, the factor fills the whole lower triangle: 55 nonzeros against 19 in the matrix. After the AMD ordering, which places the hub next to last, the factor has exactly the pattern of the matrix, 19 nonzeros, and no fill. Measured with spchol_factor and spchol_factor_ord at revision 1f2ddee.</desc>
