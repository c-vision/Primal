<svg xmlns="http://www.w3.org/2000/svg" width="780" height="540" viewBox="0 0 780 540" role="img" aria-labelledby="title desc">
  <title id="title">Slices of the 3x3 elliptope</title>
  <desc id="desc">Three slices of the set of 3x3 correlation matrices with unit diagonal, in the plane of the entries X12 and X13, for X23 = 0.5, 0 and -0.5. The line X12 + X13 = -1 touches the slice X23 = -0.5 at (-0.5, -0.5), the optimum -3/2 of the triangle max-cut SDP. Analytic figure; the minimum on each slice is checked against PRIMAL at revision 1f2ddee.</desc>
