<svg xmlns="http://www.w3.org/2000/svg" width="700" height="500" viewBox="0 0 700 500" role="img" aria-labelledby="title desc">
  <title id="title">Feasible polygon and two simplex pivots</title>
  <desc id="desc">Feasible polygon with vertices (0,0), (2,0), (2,2) and (0,4) for maximize 3x+2y with x+y&lt;=4 and x&lt;=2. Two simplex pivots go from (0,0) to (2,0) and then to (2,2), where the objective is 10. Dashed lines are the level sets 3x+2y=6 and 3x+2y=10. Analytic figure, computed at revision 1f2ddee.</desc>
