    <text x="420" y="317">1</text>
    <text x="298" y="190">1</text>
    <text x="298" y="85">2</text>
    <text x="336" y="136">t &gt; |u₁|</text>
    <text x="481" y="169">t = |u₁|</text>
    <text x="424" y="252">infeasible</text>
  </g>
</svg>
