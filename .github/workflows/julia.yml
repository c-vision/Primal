name: julia

# Test suite for the Julia package in `julia/` (JuMP / MathOptInterface front
# end over libprimal).  The C library is not built here: the package loads the
# prebuilt `PrimalSolver_jll` artifact, exactly as a user installing it from the
# General registry does.  The C code is covered by `.github/workflows/ci.yml`.
on:
  push:
    branches: [ master ]
    paths:
      - 'julia/**'
      - 'examples/julia/**'
      - 'primal.h'
      - '.github/workflows/julia.yml'
  pull_request:
    paths:
      - 'julia/**'
      - 'examples/julia/**'
      - 'primal.h'
      - '.github/workflows/julia.yml'
  workflow_dispatch:

jobs:
  test:
    name: test (Julia ${{ matrix.version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version: [ '1.10', '1' ]
        # Linux only, measured 2026-11-15: every `macos-*` job of this
        # repository is cancelled by GitHub before a runner is assigned (see the
        # note in ci.yml), so a macOS entry would only turn the run red.
        os: [ ubuntu-latest ]
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v2
      - name: Instantiate
        run: julia --project=julia -e 'using Pkg; Pkg.instantiate()'
      # `Pkg.test()` runs julia/test/runtests.jl: the MathOptInterface and JuMP
      # suites, then the 171 programs of examples/julia (the only cover of the
      # low-level API in src/Model.jl).  No coverage is uploaded: the report
      # would go to a third-party service that needs a token, and a step that
      # fails with `Token required` while the job stays green proves nothing.
      # For a local report use `PRIMALSOLVER_COVERAGE=1` with
      # `--code-coverage=user` (see julia/test/examples.jl).
      - name: Test
        run: julia --project=julia -e 'using Pkg; Pkg.test()'
